name: MyAtlas read-only validation
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['progress/leetcode/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect committed Production and historic evidence
        run: python3 -B scripts/check-adaptive-production.py
      - name: Focused evidence and presentation contracts
        run: |
          python3 -B -m unittest scripts.tests.test_course_completion scripts.tests.test_git_project_completion scripts.tests.test_myatlas_release
          for test in progress-analytics universal-progress completion portfolio copy; do node "tests/myatlas/$test.cjs"; done
          git diff --exit-code -- docs/knowledge-map state/knowledge-atlas data/knowledge src/myatlas
