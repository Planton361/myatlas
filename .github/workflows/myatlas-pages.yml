name: MyAtlas Pages
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['progress/leetcode/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *" # Daily 05:23 UTC, default branch only.
permissions:
  contents: read
concurrency:
  group: myatlas-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decision.outputs.build }}
      project_commit: ${{ steps.decision.outputs.project_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read latest canonical public project main
        uses: actions/checkout@v4
        with:
          repository: Planton361/hyperskill-projects
          ref: main
          path: build/evidence/hyperskill-projects
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservative daily revision decisions
        run: python3 -B -m unittest scripts.tests.test_project_sync
      - name: Validate evidence and compare deployed revisions
        id: decision
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: python3 -B scripts/check-project-sync.py --evidence-root build/evidence/hyperskill-projects --event "$WORKFLOW_EVENT" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-sync-decision
          path: project-sync-report.json
  build:
    needs: project-check
    if: needs.project-check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read canonical public Hyperskill project exports
        uses: actions/checkout@v4
        with:
          repository: Planton361/hyperskill-projects
          ref: ${{ needs.project-check.outputs.project_commit }}
          path: build/evidence/hyperskill-projects
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public evidence and readable differential summary
        run: |
          python3 -B scripts/sync-hyperskill-projects.py --evidence-root build/evidence/hyperskill-projects > "$RUNNER_TEMP/progress-review.json"
          python3 -B scripts/sync-project-completion.py --summary < "$RUNNER_TEMP/progress-review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked browser dependencies
        run: |
          npm ci --prefix scripts/knowledge_atlas --ignore-scripts
          scripts/knowledge_atlas/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Full isolated Pages and browser acceptance (no deployment)
        run: python3 -B scripts/validate-pages-candidate.py --evidence-root build/evidence/hyperskill-projects
      - name: Preserve committed evidence and frozen sources
        run: git diff --exit-code -- docs/knowledge-map state/knowledge-atlas data/knowledge src/myatlas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myatlas-review-${{ github.sha }}
          path: |
            test-results/
            build/leetcode-cpu-manifest.json
            ${{ runner.temp }}/progress-review.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an outdated main artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          actual_sha=$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
  sync-report:
    if: always()
    needs: [project-check, build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: project-sync-decision
          path: report
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: myatlas-review-${{ github.sha }}
          path: build-review
      - name: Summarize checked revision and terminal job states
        env:
          CHECK_STATUS: ${{ needs.project-check.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          path = Path('report/project-sync-report.json')
          value = json.loads(path.read_text()) if path.exists() else {'error': 'Evidence check did not produce a report; inspect check job logs'}
          value.update(check_status=os.environ['CHECK_STATUS'], build_status=os.environ['BUILD_STATUS'], deploy_status=os.environ['DEPLOY_STATUS'], run_url=os.environ['RUN_URL'])
          if value['build_status'] == 'failure':
              reports = list(Path('build-review').rglob('pages-candidate.json'))
              value['error'] = json.loads(reports[0].read_text()).get('error') if reports else 'Build failed before Pages acceptance; inspect validation step in run_url'
          Path('sync-report.json').write_text(json.dumps(value, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out: out.write('### Project sync result\n\n```json\n'+json.dumps(value, indent=2)+'\n```\n')
          PYREPORT
      - uses: actions/upload-artifact@v4
        with:
          name: project-sync-result
          path: sync-report.json
