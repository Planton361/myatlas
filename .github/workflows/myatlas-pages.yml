name: MyAtlas Pages
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['progress/leetcode/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myatlas-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read canonical public Hyperskill project exports
        uses: actions/checkout@v4
        with:
          repository: Planton361/hyperskill-projects
          ref: main
          path: build/evidence/hyperskill-projects
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed edition and completion evidence
        run: |
          python3 -B scripts/check-myatlas-production.py
          python3 -B -m unittest scripts.tests.test_course_completion scripts.tests.test_git_project_completion scripts.tests.test_myatlas_release scripts.tests.test_myatlas_navigation scripts.tests.test_external_completion
          for test in progress-analytics universal-progress completion portfolio copy geometry-measurements; do node "tests/myatlas/$test.cjs"; done
      - name: Validate rights-safe LeetCode summary sources
        run: |
          python3 -B -m unittest scripts.tests.test_leetcode_progress scripts.tests.test_leetcode_cpu
          node --test tests/leetcode-progress/loader.cjs
      - name: Validate owner publisher without real GitHub writes
        run: node --test tools/chrome-tracker/tests/core.cjs tools/chrome-tracker/tests/worker.cjs tools/chrome-tracker/tests/package.cjs tools/chrome-tracker/tests/public-sync.cjs
      - name: Generate public evidence and readable differential summary
        run: |
          python3 -B scripts/sync-hyperskill-projects.py --evidence-root build/evidence/hyperskill-projects > "$RUNNER_TEMP/progress-review.json"
          python3 -B scripts/sync-project-completion.py --summary < "$RUNNER_TEMP/progress-review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Pages artifact from committed sources
        run: |
          python3 -B scripts/build-myatlas.py
          python3 -B scripts/check-myatlas-production.py --site build/pages/knowledge-map --current-head
          cp docs/.nojekyll build/pages/.nojekyll
      - name: Apply and validate the approved persistent navigation link
        run: |
          python3 -B scripts/build-myatlas-navigation.py
          python3 -B scripts/build-myatlas-navigation.py --check
      - name: Bind progress to canonical Hyperskill project exports
        run: |
          python3 -B scripts/build-myatlas-external.py --evidence-root build/evidence/hyperskill-projects
          python3 -B scripts/build-myatlas-external.py --check --evidence-root build/evidence/hyperskill-projects
      - name: Package the sibling LeetCode progress route
        run: python3 -B scripts/build-leetcode-progress.py
      - name: Package the owner-approved CPU Atlas sibling route
        run: python3 -B scripts/build-leetcode-atlas.py
      - name: Install locked focused browser tooling
        run: |
          npm ci --prefix scripts/knowledge_atlas --ignore-scripts
          scripts/knowledge_atlas/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Validate the actual repository base path
        env:
          HYPERSKILL_EVIDENCE_ROOT: build/evidence/hyperskill-projects
          MYATLAS_PRE_RELEASE_PROGRESS: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
        run: |
          mkdir -p build/preview
          ln -s ../pages build/preview/myatlas
          python3 -B -m http.server 8807 --bind 127.0.0.1 --directory build/preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8807/myatlas/knowledge-map/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/myatlas/release.cjs
          node tests/myatlas/navigation.cjs
          node tests/myatlas/geometry-browser.cjs
          node tests/leetcode-progress/browser.cjs
          node tests/leetcode-atlas/progress.cjs test-results/leetcode-cpu
          node tests/leetcode-atlas/top-ui.cjs test-results/leetcode-cpu after
          git diff --exit-code -- docs/knowledge-map state/knowledge-atlas data/knowledge src/myatlas
      - uses: actions/upload-artifact@v4
        with:
          name: myatlas-review-${{ github.sha }}
          path: |
            test-results/v66-release.json
            test-results/v66-geometry.json
            test-results/myatlas-navigation.json
            test-results/leetcode-progress.json
            test-results/leetcode-cpu/*.json
            build/leetcode-cpu-manifest.json
            ${{ runner.temp }}/progress-review.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an outdated main artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          actual_sha=$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
